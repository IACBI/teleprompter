[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleprompter"
dynamic = ["version"]
description = "A professional studio-grade teleprompter with a transparent overlay display."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "𝓐.𝓒.𝓑" }]
keywords = ["teleprompter", "prompter", "broadcast", "studio", "presentation", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
hotkeys = ["keyboard>=0.13"]
audio = ["sounddevice>=0.4", "numpy>=1.24"]
pdf = ["PyMuPDF>=1.23"]
all = ["keyboard>=0.13", "sounddevice>=0.4", "numpy>=1.24", "PyMuPDF>=1.23"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.6",
]

[project.urls]
Homepage = "https://github.com/IACBI/teleprompter"
Documentation = "https://github.com/IACBI/teleprompter/tree/main/docs"
Changelog = "https://github.com/IACBI/teleprompter/blob/main/CHANGELOG.md"
Issues = "https://github.com/IACBI/teleprompter/issues"
Source = "https://github.com/IACBI/teleprompter"

[project.scripts]
teleprompter = "teleprompter.app:main"

[project.gui-scripts]
teleprompter-gui = "teleprompter.app:main"

[tool.hatch.version]
path = "src/teleprompter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/teleprompter"]

# ── Lint / format ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# The 1.x single-file build is kept for reference only; it is not shipped and is
# not held to the new style.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "TID",       # tidy imports
]
ignore = [
    "E501",      # line length is handled by the formatter
    "B008",      # function call in default argument — common in Qt code
    # Turkish sample text, typographic dashes and middots are deliberate.
    "RUF001", "RUF002", "RUF003",
    # Intra-package relative imports keep the layer boundaries visible.
    "TID252",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["teleprompter"]

# ── Types ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# The pure-Python core is held to a stricter standard than the Qt layer.
module = ["teleprompter.core.*", "teleprompter.storage.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["keyboard.*", "sounddevice.*", "fitz.*"]
ignore_missing_imports = true

# ── Tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gui: tests that need a QApplication and a display",
]

[tool.coverage.run]
source = ["src/teleprompter"]
branch = true
