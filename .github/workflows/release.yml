name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  windows-executable:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      # The stock Python .gitignore excludes *.spec, which once left the build
      # spec out of the checkout entirely. Fail here with a clear reason rather
      # than inside PyInstaller.
      - name: Check the build spec is present
        run: |
          if (-not (Test-Path packaging/teleprompter.spec)) {
            throw "packaging/teleprompter.spec is missing from the checkout — is it gitignored?"
          }
        shell: pwsh

      - name: Draw the application icon
        run: python packaging/make_icon.py packaging/teleprompter.ico

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/teleprompter.spec

      - name: Check that the executable starts
        run: |
          Start-Process -FilePath dist\TelePrompter.exe -PassThru | ForEach-Object {
            Start-Sleep -Seconds 12
            if ($_.HasExited) { throw "TelePrompter.exe exited early with $($_.ExitCode)" }
            Stop-Process -Id $_.Id -Force
          }
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: TelePrompter-windows
          path: dist/TelePrompter.exe
          if-no-files-found: error

  wheel:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: TelePrompter-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [windows-executable, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          # Globbed rather than named per directory, so the release does not
          # break if the download action changes how it nests artifacts.
          files: |
            artifacts/**/TelePrompter.exe
            artifacts/**/*.whl
            artifacts/**/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
